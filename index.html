<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Halloween Trivia 🎃</title>
<style>
  :root{
    --ink:#0d0518; --panel:rgba(255,255,255,.06); --panel-border:rgba(255,122,24,.28);
    --pumpkin:#ff7a18; --amber:#f5a623; --lav:#c9b8e8; --mute:#8a7aa8;
    --green:#17bf63; --red:#e0245e; --blue:#1d9bf0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at top,#2d1b4e 0%,#1a0b2e 55%,#0d0518 100%);
    color:#fff;font-family:'Trebuchet MS',system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 48px;
  }
  h1{font-size:34px;margin:8px 0 4px;text-align:center;text-shadow:0 0 18px var(--pumpkin)}
  .sub{color:var(--lav);margin-top:0;text-align:center}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:18px;padding:24px;width:100%;max-width:400px;margin-top:22px}
  label{font-size:14px;color:var(--amber);font-weight:700}
  input{width:100%;margin-top:8px;padding:14px 16px;border-radius:12px;border:none;font-size:18px;background:#fff;color:var(--ink);outline:none}
  button{font-family:inherit}
  .btn{width:100%;margin-top:18px;padding:15px;border-radius:12px;border:none;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .note{color:var(--mute);font-size:12px;margin-top:22px;max-width:360px;text-align:center;line-height:1.55}
  .row{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:900px}
  .tag{font-size:13px;color:var(--lav)}
  .bar{width:100%;max-width:900px;height:10px;background:rgba(255,255,255,.1);border-radius:8px;margin-top:8px;overflow:hidden}
  .fill{height:100%;transition:width .2s linear}
  .timer{font-size:44px;font-weight:800;margin:10px 0}
  .clue{background:rgba(255,255,255,.08);border-radius:16px;padding:24px 20px;width:100%;max-width:620px;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;line-height:1.3;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:620px;margin-top:16px}
  .opt{color:#fff;border:none;border-radius:14px;padding:20px 14px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .opt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .lb-item{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;margin-bottom:5px;background:rgba(255,255,255,.05)}
  .lb-me{background:rgba(255,122,24,.25)!important}
  .hidden{display:none}
  .center{display:flex;flex-direction:column;align-items:center;width:100%}

  /* Presenter (big screen) styles */
  .p-wrap{max-width:1000px;width:100%}
  .p-clue{font-size:clamp(28px,4vw,52px);font-weight:800;text-align:center;line-height:1.25;margin:18px 0}
  .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:900px;margin-top:10px}
  .p-opt{color:#fff;border-radius:18px;padding:26px 22px;font-size:clamp(20px,2.4vw,30px);font-weight:800;display:flex;align-items:center;gap:16px}
  .p-timer{font-size:clamp(48px,7vw,90px);font-weight:900;line-height:1}
  .p-count{font-size:18px;color:var(--lav)}
  .p-name-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin-top:18px}
  .p-name{background:rgba(255,122,24,.2);border:1px solid var(--panel-border);border-radius:999px;padding:10px 18px;font-size:20px;font-weight:700}
  .p-lb{width:100%;max-width:640px;margin-top:20px}
  .p-lb .lb-item{font-size:22px;padding:12px 18px}
  #hostReset{position:fixed;top:14px;right:14px;z-index:50;background:rgba(224,36,94,.9);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  #hostReset:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
</style>
</head>

let db, gameRef, playersRef, ready=false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  gameRef = db.collection("rooms").doc(ROOM);
  playersRef = gameRef.collection("players");
  ready = true;
} catch(e){ console.error(e); }

let me = { id:"", name:"" };
// Restore identity after a refresh so the player rejoins as the SAME person
// instead of being kicked to the join screen and creating a duplicate.
if(!IS_HOST){
  try{
    const saved = JSON.parse(localStorage.getItem("htrivia_me")||"null");
    if(saved && saved.id && saved.name && saved.room===ROOM){ me = {id:saved.id, name:saved.name}; }
  }catch(e){}
}
let game = null;
let players = {};
let myAnswer = null;
let screen = (!IS_HOST && me.id) ? "lobby" : (IS_HOST ? "host" : "join");
let playerQDrawn = -1; // which question index currently has buttons drawn on the phone
const app = document.getElementById("app");
const nowMs = () => Date.now();

function subscribe(){
  gameRef.onSnapshot(d=>{ game = d.exists ? d.data() : null; render(); });
  playersRef.onSnapshot(s=>{
    players = {}; s.forEach(doc=> players[doc.id]=doc.data());
    // If we restored an identity from a refresh but our player record is gone
    // (e.g. the host reset the room), re-create it once so we're not stuck.
    if(!IS_HOST && me.id && !players[me.id] && !recreating){
      recreating = true;
      const av = Object.keys(players).length;
      playersRef.doc(me.id).set({name:me.name,score:0,answers:{},av})
        .catch(e=>console.error(e))
        .finally(()=>{ recreating=false; });
    }
    render();
  });
}
let recreating = false;

// Presenter drives the clock
setInterval(()=>{
  render();
  if(!IS_HOST || !game) return;
  if(game.phase==="lobby" || game.phase==="ended") return;
  const el = (nowMs() - game.phaseStart)/1000;
  if(game.phase==="question" && el>=QUESTION_TIME){
    gameRef.update({phase:"reveal",phaseStart:nowMs()});
  }
  // reveal → next is now manual (host taps "Next question"); no auto-advance.
},250);

async function nextQuestion(){
  if(!game) return;
  const next = game.qIndex+1;
  if(next>=QUESTIONS.length) await gameRef.update({phase:"ended",phaseStart:nowMs()});
  else await gameRef.update({phase:"question",qIndex:next,phaseStart:nowMs()});
}

// ---- actions ----
async function ensureGameDoc(){
  const g = await gameRef.get();
  if(!g.exists) await gameRef.set({phase:"lobby",qIndex:0,phaseStart:nowMs()});
}
async function joinGame(){
  const el = document.getElementById("nick");
  const name = el.value.trim();
  if(!name) return;
  me.id = "p_"+Math.random().toString(36).slice(2,9);
  me.name = name;
  await ensureGameDoc();
  // avatar number = how many players are already in (join order) → unique up to 100
  const snap = await playersRef.get();
  const av = snap.size;
  await playersRef.doc(me.id).set({name,score:0,answers:{},av});
  try{ localStorage.setItem("htrivia_me", JSON.stringify({id:me.id,name:me.name,room:ROOM})); }catch(e){}
  screen="lobby"; render();
}
async function startGame(){ await gameRef.update({phase:"question",qIndex:0,phaseStart:nowMs()}); }
async function submitAnswer(choice){
  if(myAnswer) return;
  if(!game || game.phase!=="question") return;
  myAnswer = {choice};
  render(); // instant feedback — don't wait for the network round-trip
  let elapsed = (nowMs()-game.phaseStart)/1000;
  if(!isFinite(elapsed) || elapsed<0) elapsed=0;
  if(elapsed>QUESTION_TIME) elapsed=QUESTION_TIME;
  const q = QUESTIONS[game.qIndex];
  const correct = choice===q.answer;
  let earned = 0;
  if(correct){ const frac=Math.max(0,1-elapsed/QUESTION_TIME); earned=Math.round(MAX_POINTS*(0.5+0.5*frac)); }
  const meDoc = players[me.id]||{score:0,answers:{}};
  const answers = Object.assign({}, meDoc.answers, {[game.qIndex]:{choice,correct,earned}});
  try{
    await playersRef.doc(me.id).update({score:(meDoc.score||0)+earned, answers});
  }catch(e){ console.error("answer save failed",e); }
  render();
}
async function resetGame(confirmFirst){
  if(confirmFirst && !confirm("Reset the game? This removes ALL players and scores and returns everyone to the lobby.")) return;
  const snap = await playersRef.get();
  const batch = db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  await gameRef.set({phase:"lobby",qIndex:0,phaseStart:nowMs()});
  myAnswer=null; lastQ=-1; render();
}

let lastQ = -1;
function syncAnswerState(){
  if(game && game.phase==="question" && game.qIndex!==lastQ){
    lastQ = game.qIndex;
    playerQDrawn = -1; // force fresh button draw for the new question
    const ex = players[me.id]?.answers?.[game.qIndex];
    myAnswer = ex ? {choice:ex.choice} : null;
  }
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function sorted(){return Object.entries(players).map(([id,v])=>({id,...v})).sort((a,b)=>(b.score||0)-(a.score||0));}
function answeredCount(qi){return Object.values(players).filter(p=>p.answers && p.answers[qi]!==undefined).length;}

// Player link = current URL with ?host and any query string removed
function playerLink(){ return location.origin + location.pathname; }
function renderQR(){
  const box = document.getElementById("qrbox");
  if(!box || box.childElementCount>0) return; // already has a QR
  if(typeof QRCode==="undefined"){ box.innerHTML = '<span style="color:#333;font-size:12px;text-align:center">'+esc(playerLink())+'</span>'; return; }
  try{
    new QRCode(box, { text: playerLink(), width:188, height:188, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){ box.innerHTML = '<span style="color:#333;font-size:12px">'+esc(playerLink())+'</span>'; }
}

// ============ RENDER ============
function render(){
  if(!ready){ app.innerHTML = `<div class="card"><p style="color:#e0245e">⚠️ Firebase isn't configured.</p></div>`; return; }
  syncAnswerState();
  if(IS_HOST){ ensureHostResetButton(); renderHost(); return; }
  renderPlayer();
}

// Always-visible reset button on the host screen (top-right corner)
function ensureHostResetButton(){
  if(document.getElementById("hostReset")) return;
  const b = document.createElement("button");
  b.id = "hostReset";
  b.textContent = "🧹 Reset game";
  b.onclick = ()=>resetGame(true);
  document.body.appendChild(b);
}

// ---------- PRESENTER (big screen) ----------
let lastLobbySig="";
let lastRevealSig="";
function renderHost(){
  const count = Object.keys(players).length;

  if(!game || game.phase==="lobby"){
    // Only rebuild the lobby DOM when the player list actually changes,
    // otherwise the QR code would be destroyed and redrawn every poll.
    const sig = "lobby|"+sorted().map(p=>p.name+":"+(p.av??"")).join(",");
    if(sig===lastLobbySig){ return; }
    lastLobbySig = sig;
    const names = sorted().map(p=>`<span class="p-name" style="display:inline-flex;align-items:center;gap:8px">${avatarHTML(p.av??0,30)}${esc(p.name)}</span>`).join("");
    app.innerHTML = `
      <div class="p-wrap center">
        <div style="font-size:70px;margin-top:10px">🎃</div>
        <h1 style="font-size:44px">Halloween Trivia</h1>
        <p class="sub" style="font-size:20px">Scan to join on your phone</p>
        <div id="qrbox" style="background:#fff;padding:16px;border-radius:16px;margin-top:14px;width:220px;height:220px;display:flex;align-items:center;justify-content:center"></div>
        <div style="margin-top:14px;font-size:22px;color:var(--amber);font-weight:800">Players in: ${count}</div>
        <div class="p-name-grid">${names||'<span class="sub">Waiting for players…</span>'}</div>
        <button class="btn" style="background:var(--green);max-width:420px;font-size:22px;margin-top:26px" onclick="startGame()">
          Start Game (${QUESTIONS.length} questions)
        </button>
        <button class="btn" style="background:rgba(255,255,255,.12);max-width:420px;font-size:15px;margin-top:10px" onclick="resetGame(true)">
          🧹 Reset — clear all players &amp; scores
        </button>
        <p class="note">Start whenever everyone's in. New players can join right up until you press Start.<br>Use Reset after a test run to wipe everyone and start fresh.</p>
      </div>`;
    renderQR();
    return;
  }

  const q = QUESTIONS[game.qIndex];
  const elapsed = (nowMs()-game.phaseStart)/1000;
  lastLobbySig=""; // so lobby rebuilds fresh if we reset back to it later

  if(game.phase==="question"){
    lastRevealSig=""; // reveal will rebuild fresh next time
    const remaining = Math.max(0,Math.ceil(QUESTION_TIME-elapsed));
    const pct=(remaining/QUESTION_TIME)*100;
    app.innerHTML = `
      <div class="p-wrap center">
        <div class="row"><span class="tag">${esc(q.round)}</span><span class="tag">Question ${game.qIndex+1} of ${QUESTIONS.length}</span></div>
        <div class="bar"><div class="fill" style="width:${pct}%;background:${remaining<=5?'var(--red)':'var(--green)'}"></div></div>
        <div style="display:flex;align-items:center;gap:24px;margin-top:14px">
          <div class="p-timer" style="color:${remaining<=5?'var(--red)':'#fff'}">${remaining}</div>
          <div class="p-count">✋ ${answeredCount(game.qIndex)} / ${count} answered</div>
        </div>
        ${q.img
          ? `<img src="${q.img}" alt="Guess the movie" style="max-height:38vh;max-width:90%;border-radius:16px;margin:14px 0;box-shadow:0 6px 24px rgba(0,0,0,.5)" />`
          : `<div class="p-clue">${esc(q.clue)}</div>`}
        <div class="p-grid">
          ${q.options.map((o,i)=>`<div class="p-opt" style="background:${COLORS[i]}"><span>${SHAPES[i]}</span>${esc(o)}</div>`).join("")}
        </div>
        <p class="note">Answer on your phone — match the shape &amp; color. &nbsp;·&nbsp; <span style="cursor:pointer;text-decoration:underline" onclick="resetGame(true)">Reset game</span></p>
      </div>`;
    return;
  }

  if(game.phase==="reveal"){
    // Only build once per question — the reveal screen is static until the host
    // advances, so rebuilding every tick would eat clicks on the Next button.
    const sig = "reveal|"+game.qIndex+"|"+sorted().map(p=>p.name+p.score).join(",");
    if(sig===lastRevealSig) return;
    lastRevealSig = sig;
    const lb = sorted().slice(0,10).map((p,i)=>`<div class="lb-item"><span style="display:inline-flex;align-items:center;gap:10px">${["🥇","🥈","🥉"][i]||`<span style="width:24px;display:inline-block;text-align:center">${i+1}.</span>`} ${avatarHTML(p.av??0,32)} ${esc(p.name)}</span><span style="font-weight:800">${p.score||0}</span></div>`).join("");
    app.innerHTML = `
      <div class="p-wrap center">
        <span class="tag">Question ${game.qIndex+1} of ${QUESTIONS.length}</span>
        <div style="background:rgba(23,191,99,.15);border:3px solid var(--green);border-radius:18px;padding:20px 34px;margin-top:12px;text-align:center">
          <div style="font-size:16px;color:#8affc0">Correct answer</div>
          <div style="font-size:clamp(26px,3.4vw,40px);font-weight:900">${SHAPES[q.answer]} ${esc(q.options[q.answer])}</div>
        </div>
        <div class="p-lb">
          <div style="font-size:18px;color:var(--amber);font-weight:800;margin-bottom:8px">🏆 Leaderboard</div>${lb}
        </div>
        <button class="btn" style="background:var(--green);max-width:420px;font-size:20px;margin-top:20px" onclick="nextQuestion()">
          ${game.qIndex+1>=QUESTIONS.length ? "See Final Results 🏆" : "Next Question ▶"}
        </button>
        <p class="note"><span style="cursor:pointer;text-decoration:underline" onclick="resetGame(true)">Reset game</span></p>
      </div>`;
    return;
  }

  if(game.phase==="ended"){
    const titles=["🥇 The Halloween Mastermind","🥈 The Spooky Scholar","🥉 The Pumpkin Professor"];
    const rows = sorted().map((p,i)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-radius:14px;margin-bottom:8px;background:${i<3?'rgba(255,122,24,.2)':'rgba(255,255,255,.05)'}">
        <div style="display:flex;align-items:center;gap:14px">${avatarHTML(p.av??0,46)}<div><div style="font-size:20px;font-weight:800">${titles[i]||((i+1)+". "+esc(p.name))}</div>${titles[i]?`<div style="font-size:15px;color:var(--lav)">${esc(p.name)}</div>`:""}</div></div>
        <span style="font-size:24px;font-weight:900;color:var(--amber)">${p.score||0}</span>
      </div>`).join("");
    app.innerHTML = `
      <div class="p-wrap center">
        <div style="font-size:64px;margin-top:14px">🏆</div>
        <h1>Final Results</h1>
        <div style="width:100%;max-width:640px;margin-top:12px">${rows}</div>
        <button class="btn" style="background:var(--red);max-width:420px" onclick="resetGame(true)">Reset for a New Game</button>
        <p class="note">Happy Halloween! 🎃👻</p>
      </div>`;
    return;
  }
}

// ---------- PLAYER (phone) ----------
function renderPlayer(){
  if(game){
    if((game.phase==="question"||game.phase==="reveal") && screen==="lobby") screen="play";
    if(game.phase==="ended") screen="end";
    if(game.phase==="lobby" && screen==="play") screen="lobby";
  }

  if(screen==="join"){
    if(document.getElementById("nick")) return; // don't wipe typing
    app.innerHTML = `
      <div style="font-size:64px;margin-top:30px">🎃</div>
      <h1>Halloween Trivia</h1>
      <p class="sub">Enter a nickname to join</p>
      <div class="card">
        <label for="nick">Your nickname</label>
        <input id="nick" maxlength="20" placeholder="e.g. Resting Witch Face" />
        <button class="btn" style="background:var(--pumpkin)" onclick="joinGame()">Join Game 👻</button>
      </div>
      <p class="note">Watch the big screen for questions. Answer here on your phone.</p>`;
    const i=document.getElementById("nick"); if(i){i.focus(); i.onkeydown=e=>{if(e.key==="Enter")joinGame();};}
    return;
  }

  if(screen==="lobby"){
    const myAv = players[me.id]?.av ?? 0;
    app.innerHTML = `
      <div style="margin-top:34px">${avatarHTML(myAv,90)}</div>
      <h1 style="font-size:26px;margin-top:14px">You're in!</h1>
      <p class="sub">${esc(me.name)} — watch the big screen.<br>The game starts when the host is ready.</p>
      <div class="card center"><div style="font-size:15px;color:var(--amber)">Waiting for the game to start…</div></div>`;
    return;
  }

  if(screen==="play" && game){
    const q = QUESTIONS[game.qIndex];
    // Guard against clock drift between host and this phone: clamp so the
    // countdown can't show a tiny or negative number from skew. Display only —
    // the host decides when the question actually ends.
    let elapsed = (nowMs()-game.phaseStart)/1000;
    if(!isFinite(elapsed) || elapsed<0) elapsed=0;
    if(elapsed>QUESTION_TIME) elapsed=QUESTION_TIME;

    if(game.phase==="question"){
      const remaining = Math.max(0,Math.ceil(QUESTION_TIME-elapsed));
      if(myAnswer){
        app.innerHTML = `
          <div style="font-size:40px;margin-top:40px">🔒</div>
          <h1 style="font-size:24px">Locked in!</h1>
          <p class="sub">Look up at the screen.<br>Time left: ${remaining}s</p>`;
        playerQDrawn = -1;
        return;
      }
      // Build the buttons ONCE per question. On later ticks, only update the
      // countdown text — never rebuild the buttons, or a tap landing during a
      // rebuild gets discarded (that's the "had to tap several times" bug).
      // But if the buttons somehow aren't on screen (transition/refresh), force
      // a rebuild so the player never gets stuck with no options.
      const buttonsPresent = document.getElementById("pcount") && document.querySelector(".grid .opt");
      if(playerQDrawn !== game.qIndex || !buttonsPresent){
        playerQDrawn = game.qIndex;
        app.innerHTML = `
          <p class="sub" style="margin-top:20px">Tap your answer 👇 &nbsp;·&nbsp; <span id="pcount">${remaining}</span>s left</p>
          <div class="grid" style="margin-top:8px">
            ${q.options.map((o,i)=>`<button class="opt" style="background:${COLORS[i]};font-size:16px;padding:20px 12px;line-height:1.2" onclick="submitAnswer(${i})"><span style="font-size:22px">${SHAPES[i]}</span>${esc(o)}</button>`).join("")}
          </div>
          <p class="note">${q.img?"Look up at the screen for the picture.":"Match the shape &amp; color to the big screen."}</p>`;
      } else {
        const c = document.getElementById("pcount");
        if(c) c.textContent = remaining;
      }
      return;
    }

    if(game.phase==="reveal"){
      const mine = players[me.id]?.answers?.[game.qIndex];
      const head = mine ? (mine.correct?"✅ Correct!":"❌ Not quite") : "⏰ Missed it";
      const myScore = players[me.id]?.score||0;
      const rank = sorted().findIndex(p=>p.id===me.id)+1;
      app.innerHTML = `
        <div style="font-size:30px;margin:40px 0 8px;text-align:center;font-weight:800">${head}</div>
        ${mine&&mine.correct?`<div style="color:var(--green);font-size:24px;font-weight:800">+${mine.earned} pts</div>`:""}
        <div class="card center">
          <div style="font-size:15px;color:var(--lav)">Your score</div>
          <div style="font-size:34px;font-weight:900;color:var(--amber)">${myScore}</div>
          <div style="font-size:14px;color:var(--lav);margin-top:4px">Rank #${rank} of ${Object.keys(players).length}</div>
        </div>
        <p class="note">Look up at the screen for the leaderboard.</p>`;
      return;
    }
  }

  if(screen==="end"){
    const myScore = players[me.id]?.score||0;
    const rank = sorted().findIndex(p=>p.id===me.id)+1;
    app.innerHTML = `
      <div style="font-size:60px;margin-top:30px">🏆</div>
      <h1>Game Over!</h1>
      <div class="card center">
        <div style="font-size:15px;color:var(--lav)">Final score</div>
        <div style="font-size:38px;font-weight:900;color:var(--amber)">${myScore}</div>
        <div style="font-size:15px;color:var(--lav);margin-top:4px">You placed #${rank} of ${Object.keys(players).length}</div>
      </div>
      <p class="note">Winners are on the big screen. Happy Halloween! 🎃</p>`;
    return;
  }

  app.innerHTML = `<p style="margin-top:40px">Loading… 🕸️</p>`;
}

window.joinGame=joinGame; window.startGame=startGame; window.submitAnswer=submitAnswer; window.resetGame=resetGame; window.nextQuestion=nextQuestion;
if(ready){ subscribe(); } render();
</script>
</body>
</html>
